[package]
name = "img"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local Rust-native GIF operation stack"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["gif"] }
rfd = "0.15"
tempfile = "3"
